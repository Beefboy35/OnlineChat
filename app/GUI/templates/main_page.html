<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="GUI/static/styles/main_page.css">
    <script type="module" src="GUI/static/scripts/main_page.js"></script>
    <meta charset="UTF-8">
    <title>Main page</title>
</head>
<body class="bg-blue-100 h-full overflow-hidden">
<header class="w-full">
    <div class="header-content bg-blue-500 rounded-b-2xl px-4 py-4 w-full text-center">
        <h1 class="text-white text-4xl font-bold mb-2">TelegramV2</h1>
        <nav class="hover:text-gray-300 hover:cursor-pointer text-2xl">
            <ul class="nav-links flex flex-col space-y-2 md:flex-row md:space-y-0 md:space-x-8 md:justify-center">
                 <li id="createChat"><span class="inline-block">Create chat</span></li>
                <li id="addToChat"><span class="inline-block">Add user</span></li>
                <li id="removeFromChat"><span class="inline-block">Remove user</span></li>
                <li id="getProfile1"><span class="inline-block">Profile</span></li>
            </ul>
        </nav>
    </div>
</header>

<div class="flex flex-col items-center p-3 text-3xl h-[calc(100vh-220px)] overflow-y-auto"> <!-- Ограничение высоты и прокрутка -->
    {% include 'profile.html' %}
    {% include 'createChat.html' %}
    {% include 'addToChatForm.html' %}
    {% include 'removeFromForm.html' %}
    <h1 class="text-3xl font-bold mb-4">Start chatting now!</h1>
    <div class="mb-1 flex flex-col">
        <input class="border border-gray-300 rounded-lg mr-2 p-1 focus:ring-2 focus:ring-blue-500"
               type="number" id="roomId" placeholder="Номер комнаты">
        <button id="enterChat" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Выбрать</button>
    </div>
    <!-- Скрытый элемент для хранения данных комнаты -->
    <div id="room-data"
         data-username="{{ nickname }}"
         data-user-id="{{ user_id }}"
         class="hidden">
    </div>

    <!-- Область сообщений -->
    <div id="messages"
         class="w-full max-w-2xl custom-height overflow-y-auto border border-gray-300 bg-white p-4 rounded-lg shadow-md">
    </div>

    <div class="flex flex-wrap items-center justify-center mt-4 gap-2">
    <!-- Никнейм -->
    <h3 id="getProfile2"
        class="bg-blue-500 flex items-center p-2 border border-gray-300 hover:ring-1
        hover:bg-blue-300 rounded-xl whitespace-nowrap text-center">
        {{nickname}}
    </h3>

    <!-- Поле ввода и кнопка -->
    <div class="flex flex-1 min-w-[200px] max-w-[600px]">
        <input id="messageInput"
               type="text"
               placeholder="Message"
               class="flex-1 p-2 border border-gray-300 rounded-l-lg
               focus:outline-none focus:ring-2 focus:ring-blue-500 text-2xl w-full"/>

        <button onclick="sendMessage()"
                class="bg-blue-500 text-white px-3 py-2
                rounded-r-lg hover:bg-blue-600 whitespace-nowrap">
            Send
        </button>
    </div>
</div>
</div>
<script src="GUI/static/scripts/addToChat.js"></script>
<script src="GUI/static/scripts/createChat.js"></script>
<script src="GUI/static/scripts/profile.js"></script>
<script src="GUI/static/scripts/removeFromForm.js"></script>

</body>
</html>
