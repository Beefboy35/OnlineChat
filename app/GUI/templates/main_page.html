<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="GUI/static/styles/main_page.css">
    <script type="module" src="GUI/static/scripts/main_page.js"></script>
    <meta charset="UTF-8">
    <title>Main page</title>
</head>
<body class="bg-blue-1ltk00">
<header>
    <div class="header-content rounded-b-2xl">
        <h1 class="text-white text-4xl font-bold mb-2">TelegramV2</h1>
        <nav class="hover:text-gray-300 hover:cursor-pointer text-2xl">
            <ul class="nav-links">
                <li id="createChat" class="mr-8">Создать чат</li>
                <li id="findFriends" class="mr-8">Искать собеседников</li>
                <li id="addToChat" class="mr-8">Добавить в чат</li>
                <li id="removeFromChat" class="mr-8">Удалить из чата</li>
                <li id="getProfile1" class="mr-8">Мой профиль</li>
                <li><a href="#" class="mr-8">Главная</a></li>
                <li><a href="https://t.me/RealBeefBoy" target="_blank">Контакты</a></li>
            </ul>
        </nav>
    </div>
</header>
<div class="flex flex-col items-center p-4 text-3xl">
    {% include 'profile.html' %}
    {% include 'createChat.html' %}
    {% include 'find_friends_form.html' %}
    <h1 class="text-3xl font-bold mb-4">Start chatting now!</h1>
    <div class="mb-1 flex flex-col">
        <input class="border border-gray-300 rounded-lg mr-2 p-1 focus:ring-2 focus:ring-blue-500"
               type="number" id="roomId" placeholder="Номер комнаты">
        <button id="enterChat" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Выбрать</button>
    </div>
    <!-- Скрытый элемент для хранения данных комнаты -->
    <div id="room-data"
         data-username="{{ nickname }}"
         data-user-id="{{ user_id }}"
         class="hidden">
    </div>

    <!-- Область сообщений -->
    <div id="messages"
         class="w-full max-w-2xl custom-height overflow-y-auto border border-gray-300 bg-white p-4 rounded-lg shadow-md">
    </div>

    <!-- Поле ввода и кнопка -->

    <div class="flex mt-4 w-full max-w-2xl">
        <h3 id="getProfile2" class="bg-blue-500 flex items-center p-2 border border-gray-300 hover:ring-1 hover:bg-blue-300 rounded-xl">{{nickname}}</h3>
        <input id="messageInput"
               type="text"
               placeholder="Введите сообщение"
               class="flex-1 p-2 border border-gray-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-2xl"/>
        <button onclick="sendMessage()"
                class="bg-blue-500 text-white px-4 py-2 rounded-r-lg hover:bg-blue-600">Отправить
        </button>
    </div>
</div>
<script src="GUI/static/scripts/createChat.js"></script>
