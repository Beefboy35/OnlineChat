<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link rel="stylesheet" href="GUI/static/styles/form_fade_away.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</head>
<body>
<div class="hidden fixed inset-0 bg-black opacity-50" id="darkenBg"></div>
<div class="hidden fixed inset-0 flex items-center justify-center" id="profileForm">
    <div class="bg-white p-6 rounded-lg shadow-xl flex flex-col items-center">
        <h2 class="text-2xl font-bold pb-4">User information</h2>
        <p class="pb-4 text-xl">Nickname: {{ nickname }}</p>
        <p class="pb-4 text-xl">Full name: {{ first_name }} {{ last_name }}</p>
        <p class="pb-4 text-xl">Phone number: {{ phone }}</p>
        <div class="flex flex-row gap-7">
            <button class="mt-4 bg-blue-600 text-white px-3 py-1 rounded focus:bg-blue-700 transition duration-200"
                    id="closeForm">Close
            </button>
            <button class="mt-4 bg-red-700 text-white px-3 py-1 rounded  transition duration-200"
                    id="logOut">Log out
            </button>
        </div>
    </div>
</div>

<script>
    document.getElementById("logOut").addEventListener("click", async () => {
    try {
        const response = await axios.post("/auth/logout")
        alert(response.data)
        window.location.href = "/login"
    } catch (e) {
        console.error("Error logging out", e)
        alert("Something went wrong( Please try again later")
    }
});
</script>
</body>
</html>
