<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="GUI/static/styles/form_fade_away.css">
    <title>Document</title>
</head>
<body>

<div id="createChatForm" class="hidden fixed inset-0 flex flex-col justify-center items-center">
    <div class="bg-white p-6 rounded-lg shadow-xl flex flex-col items-center">
        <h2 class="text-2xl font-bold pb-4">Fill in the details</h2>
        <label class="block text-gray-700">Enter chat's title</label>
        <input type="text" id="chatTitle"
               placeholder="title" name="title"
               class="w-full p-2 border border-gray-300 rounded-lg mt-2">
        <div id="statusMessage" class="hidden bg-blue-700 p-3 rounded-lg shadow-xl mt-2"></div>
        <div class="flex flex-row gap-7">
            <button class="mt-4 bg-blue-600 text-white px-4 py-2 rounded focus:bg-blue-700 transition duration-200"
                    id="Create">Create chat
            </button>
            <button class="mt-4 bg-blue-600 text-white px-4 py-2 rounded focus:bg-blue-700 transition duration-200"
                    id="closeCreateForm">Close
            </button>
        </div>
    </div>
</div>

<script>
    document.getElementById("closeCreateForm").addEventListener("click", () => {
        createChatForm.style.opacity = '0';
        createChatForm.style.transform = 'scale(0.1)';
        darkenBg.style.opacity = '0';
        setTimeout(() => {
            createChatForm.classList.add('hidden');
            darkenBg.classList.add('hidden');
        }, 400);
    });

statusMessage = document.getElementById("statusMessage")
document.getElementById("Create").addEventListener("click", async () => {
    const title_name = document.getElementById("chatTitle").value.trim();
    try {
        const response = await axios.post("/chat/create_chat", {
            title: title_name
        })
        statusMessage.innerText = response.data
        statusMessage.style.display = "block"
        setTimeout(() => {
            statusMessage.style.display = "none"
        }, 3000)
        } catch (e) {
            console.error("Error creating chat:", e)
            statusMessage.style.display = "block"
            if (e.status === 409) {
                statusMessage.innerText= `Chat ${title_name} already exists`
            } else {
                statusMessage.innerText= "Something went wrong. Try again later"
            }
            setTimeout(() => {
                statusMessage.style.display = "none"
            }, 3000)
        }
})

</script>
</body>
</html>
